<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>醫院排班系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- 左側選單：部門清單 -->
    <aside class="w-64 bg-slate-800 text-white flex flex-col">
        <div class="p-4 text-xl font-bold border-b border-slate-700">排班系統</div>
        <ul id="deptList" class="flex-1 overflow-y-auto p-2">
            <!-- 透過 sidebar.js 動態載入部門 -->
        </ul>
        <div class="p-4 border-t border-slate-700">
            <button onclick="addDepartment()" class="w-full bg-blue-600 py-2 rounded hover:bg-blue-500">+ 新增部門</button>
        </div>
    </aside>

    <!-- 右側主要內容 -->
    <main id="mainContent" class="flex-1 p-6 overflow-y-auto hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 id="currentDeptTitle" class="text-3xl font-bold text-slate-800"></h2>
            <div class="flex gap-2">
                <input type="month" id="targetMonth" class="border p-2 rounded">
                <button onclick="copyLastMonth()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">🔄 承襲上個月班表</button>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
            <!-- 直接安排工作區塊 -->
            <div class="xl:col-span-1 bg-white p-4 rounded shadow">
                <h3 class="font-bold text-lg mb-4">排班面板 (新增/修改)</h3>
                <form id="shiftForm" class="flex flex-col gap-3">
                    <input type="date" id="formDate" required class="border p-2 rounded">
                    <select id="formEmp" required class="border p-2 rounded"></select>
                    <select id="formTask" required class="border p-2 rounded"></select>
                    <div class="flex gap-2">
                        <input type="time" id="formStart" required class="border p-2 rounded w-1/2">
                        <input type="time" id="formEnd" required class="border p-2 rounded w-1/2">
                    </div>
                    <select id="formCategory" class="border p-2 rounded">
                        <option value="常規">常規</option>
                        <option value="特別備註">特別備註</option>
                    </select>
                    <input type="text" id="formRemark" placeholder="備註說明..." class="border p-2 rounded">
                    <button type="button" onclick="saveShift()" class="bg-green-600 text-white font-bold py-2 rounded">儲存排班</button>
                </form>
            </div>

            <!-- 瀏覽圖與甘特圖區塊 -->
            <div class="xl:col-span-2 bg-white p-4 rounded shadow">
                <div class="flex justify-between mb-4">
                    <h3 class="font-bold text-lg">即時排班總覽</h3>
                    <input type="date" id="ganttDate" onchange="renderGantt()" class="border p-1 rounded">
                </div>
                <!-- 點擊圖表空白處也可直接跳出新增視窗，透過 gantt.js 實作 -->
                <div id="timeline_chart" style="height: 400px; width: 100%;"></div>
            </div>
        </div>
    </main>

    <!-- 模組化 JS 引入 -->
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/department.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/gantt.js"></script>
    
    <script>
        // 系統進入點
        google.charts.load('current', {'packages':['timeline']});
        google.charts.setOnLoadCallback(async () => {
            await fetchAllData();
            renderSidebar();
        });
    </script>
</body>
</html>
